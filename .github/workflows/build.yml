name: iOS-Build (unsigniert für Sideloadly)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Xcode wählen
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true; xcodebuild -version

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Projekt erzeugen
        run: xcodegen generate

      - name: Bauen (ohne Signatur)
        run: |
          set -o pipefail
          xcodebuild \
            -project InfoPoint.xcodeproj \
            -scheme InfoPoint \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*Swift|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/InfoPoint.app

      - name: IPA packen
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/InfoPoint.app Payload/
          zip -qry InfoPoint.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: InfoPoint-ipa
          path: InfoPoint.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: xcodebuild.log

      - name: Release (bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: InfoPoint.ipa
